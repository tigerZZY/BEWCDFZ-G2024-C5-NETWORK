<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>班级通知终端</title>
    <link rel="stylesheet" href="style.css"/>
    <!-- 离线缓存 + 移动端适配 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#3182ce">
</head>
<body>
<!-- 全站访问密码弹窗 -->
<div id="accessLock" class="lock-wrap">
    <div class="lock-box animate-fade">
        <h3>班级私密入口</h3>
        <input type="password" id="accessPwd" placeholder="输入访问密码">
        <button onclick="checkAccess()">进入系统</button>
    </div>
</div>

<div id="mainWrap" style="display:none;">
    <header class="top-bar animate-down">
        <div class="top-left">
            <img id="logoImg" src="logo.png" alt="班级Logo">
            <div>
                <h1 id="className">高二X班 · 班级通知系统</h1>
                <span id="weekInfo">本周：第1周</span>
            </div>
        </div>
        <div class="top-right">
            <span id="countdown">距离假期：计算中…</span>
            <span id="weatherInfo">加载天气…</span>
            <button id="themeBtn" onclick="toggleTheme()">切换主题</button>
            <a href="admin.html" class="admin-btn">管理后台</a>
        </div>
    </header>

    <!-- 生日祝福弹窗 -->
    <div id="birthdayModal" class="alert-modal">
        <div class="alert-content birthday-style">
            <h2>🎂 今日同学生日</h2>
            <div id="birthdayText"></div>
            <button onclick="closeBirthday()">送上祝福</button>
        </div>
    </div>

    <!-- 紧急全屏弹窗 -->
    <div id="alertModal" class="alert-modal">
        <div class="alert-content">
            <h2>紧急通知</h2>
            <div id="alertText"></div>
            <button onclick="closeAlert()">我已知晓</button>
        </div>
    </div>

    <div class="container">
        <!-- 实时校园计时 -->
        <div class="card time-count-card animate-card">
            <h2>⏱️ 校园实时倒计时</h2>
            <div id="schoolTimer"></div>
        </div>

        <!-- 置顶重要通知 -->
        <div id="topNoticeWrap" class="card top-notice-card animate-card" style="display:none;">
            <h2>⭐ 置顶重要通知</h2>
            <div id="topNotice"></div>
        </div>

        <div class="card notice-card animate-card">
            <h2>📢 最新公告</h2>
            <div id="latestNotice"></div>
        </div>

        <div class="card homework-card animate-card">
            <h2>📖 今日作业专区</h2>
            <div id="homeworkList"></div>
        </div>

        <div class="card time-card animate-card">
            <h2>⏰ 作息时间表</h2>
            <div id="timeTable"></div>
        </div>

        <div class="card schedule-card animate-card">
            <h2>📚 本周课表</h2>
            <div id="scheduleTable"></div>
        </div>

        <div class="card exam-card animate-card">
            <h2>📝 考试倒计时</h2>
            <div id="examCountdown"></div>
        </div>

        <div class="card holiday-card animate-card">
            <h2>📅 节假日提醒</h2>
            <div id="holidayTip"></div>
        </div>

        <div class="card history-card animate-card">
            <h2>📜 历史通知（管理员可删除）</h2>
            <div id="historyList"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
